name: Patch P0 - Ratings and Stewards Incidents

on:
  workflow_dispatch:

jobs:
  patch-database:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行極速補齊腳本
        run: |
          python patch_p0_ratings_incidents.py

      - name: 打包最新資料庫為成果檔案 (無論是否超時均保底執行)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-hk-racing-db
          path: hk_racing.db
          retention-days: 14
