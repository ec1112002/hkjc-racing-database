name: Build Master Ultimate Database

on:
  workflow_dispatch:

jobs:
  build-master-db:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行終極合體與全量盤點
        run: |
          python build_master_db.py

      - name: 打包香港賽馬終極旗艦資料庫 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-racing-master-ultimate-db
          path: hk_racing.db
          retention-days: 30
