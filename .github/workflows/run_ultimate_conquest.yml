name: Ultimate Conquest - 19 Tables Complete

on:
  workflow_dispatch:

jobs:
  conquer-all-missing:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行全面攻克腳本
        run: |
          python patch_ultimate_conquest.py

      - name: 打包香港賽馬 19 表完全體 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-racing-absolute-master-db
          path: hk_racing.db
          retention-days: 30
