name: HKJC 5-Season Crawl & Trainer Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0,3'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 放寬至接近 6 小時上限，給予全量大數據充足下載時間
    permissions:
      contents: write

    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝所需套件
        run: |
          pip install requests beautifulsoup4 pandas openpyxl lxml

      - name: 執行全數據資產全量採集
        run: |
          python .github/workflows/run_backtest.py

      - name: 上傳全量數據庫與報表
        uses: actions/upload-artifact@v4
        with:
          name: 賽馬5季全量大數據庫與回測結果
          path: |
            hk_racing.db
            trainer_backtest_report.xlsx
            index.html
          retention-days: 30
