name: Patch P3 - Trump Cards and Running Comments

on:
  workflow_dispatch:

jobs:
  patch-trump-and-comments:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行王牌與走勢短評採集
        run: |
          python patch_p3_trump_and_comments.py

      - name: 打包終極全量資料庫 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-hk-racing-db-final
          path: hk_racing.db
          retention-days: 14
